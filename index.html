<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDCORE HMS | Hospital management that runs on your own network</title>
    <meta
      name="description"
      content="MedCore HMS is a hospital management system for patient records, appointments, billing, pharmacy, laboratory and reports, designed to run on a hospital's own network."
    />
    <!-- Link preview (WhatsApp, LinkedIn, Facebook, Slack, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDCORE HMS" />
    <meta property="og:title" content="MEDCORE HMS | Hospital management that runs on your own network" />
    <meta property="og:description" content="A hospital management system for patient records, appointments, billing, pharmacy, laboratory and reports, designed to run on a hospital's own network." />
    <meta property="og:url" content="https://medcore-iota.vercel.app/" />
    <meta property="og:image" content="https://medcore-iota.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MEDCORE logo with the text Hospital Management System" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Sets the theme before the page paints, so there is no light/dark flash -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('medcore-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
        } catch (e) {
          root.setAttribute('data-theme', 'light');
        }
        root.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
